name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        id: owner
        run: |
          echo "OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Backend Image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-backend:latest
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Frontend Admin Image
      - name: Build and push Frontend Admin image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-admin:latest
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Frontend Public Image
      - name: Build and push Frontend Public image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-public
          file: ./frontend-public/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-public:latest
            ghcr.io/${{ env.OWNER_LOWER }}/conectigreja-public:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
