<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Efeitos de iluminação de fundo -->
  <circle cx="600" cy="200" r="300" fill="#F59E0B" opacity="0.12" filter="blur(60px)" />
  <circle cx="300" cy="500" r="250" fill="#E11D48" opacity="0.1" filter="blur(80px)" />

  <!-- Borda moderna -->
  <rect x="25" y="25" width="1150" height="580" rx="24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 6" />

  <!-- Cálice & Pão estilizados (Santa Ceia) -->
  <g transform="translate(600, 180)">
    <!-- Cruz Central Suave -->
    <rect x="-10" y="-80" width="20" height="150" rx="6" fill="url(#goldGrad)" opacity="0.85" />
    <rect x="-45" y="-45" width="90" height="20" rx="6" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Cálice Dourado -->
    <path d="M -40 40 C -40 85, 40 85, 40 40 Z" fill="url(#goldGrad)" />
    <rect x="-8" y="70" width="16" height="50" fill="url(#goldGrad)" />
    <path d="M -30 120 L 30 120" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Vinho no cálice -->
    <ellipse cx="0" cy="45" rx="35" ry="10" fill="url(#wineGrad)" />
  </g>

  <!-- Tipografia Principal -->
  <text x="600" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="8" fill="#F59E0B">CELEBRAÇÃO MEMORIAL</text>
  <text x="600" y="450" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="58" letter-spacing="2" fill="#FFFFFF">GRANDE CULTO DE SANTA CEIA</text>
  <text x="600" y="500" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="22" fill="#CBD5E1">"Fazei isto em memória de Mim" — Comunhão, Louvor e Palavra Profética</text>

  <!-- Tag de Vagas & Presencial -->
  <rect x="440" y="535" width="320" height="42" rx="21" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" />
  <text x="600" y="562" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="15" fill="#FDE68A">ENTRADA FRANCA • INSCRIÇÕES ABERTAS</text>
</svg>
