<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Circular com Borda Dourada -->
  <circle cx="250" cy="250" r="230" fill="#0B0F19" stroke="url(#goldGradient)" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Anel interno sutil -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Símbolo da Cruz Central Dourada estilizada -->
  <g transform="translate(250, 220)">
    <!-- Barra Vertical da Cruz -->
    <rect x="-18" y="-130" width="36" height="230" rx="10" fill="url(#goldGradient)" />
    <!-- Barra Horizontal da Cruz -->
    <rect x="-80" y="-70" width="160" height="36" rx="10" fill="url(#goldGradient)" />
    <!-- Brilho no centro da Cruz -->
    <circle cx="0" cy="-52" r="14" fill="#FEF3C7" opacity="0.9" />
  </g>

  <!-- Ondas Conectoras / Conexão Digital (Simbolizando ConectIgreja) -->
  <path d="M 120 330 Q 250 290 380 330" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 150 355 Q 250 325 350 355" fill="none" stroke="url(#glowGradient)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

  <!-- Tipografia ConectIgreja -->
  <text x="250" y="405" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">CONECT<tspan fill="#F59E0B">IGREJA</tspan></text>
  <text x="250" y="430" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="3" fill="#94A3B8">MINISTÉRIO &amp; CONGREGAÇÕES</text>
</svg>
