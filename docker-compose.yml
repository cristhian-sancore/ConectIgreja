version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conectigreja_backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - DATABASE_URL=file:/app/data/conectigreja.db
      - EVOLUTION_API_URL=https://api.cristhiansancore.com.br
      - EVOLUTION_API_KEY=EAC94E310E46-4D87-8AAD-4262C45AF665
      - EVOLUTION_INSTANCE=teste
      - PUBLIC_URL=https://ConectIgreja.cristhiansancore.com.br
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    networks:
      - conectigreja_net

  frontend-public:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
    container_name: conectigreja_public
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - conectigreja_net

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: conectigreja_admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - conectigreja_net

volumes:
  backend_data:

networks:
  conectigreja_net:
    driver: bridge
